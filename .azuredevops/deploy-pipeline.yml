trigger: none 

pool:
  vmImage: 'ubuntu-latest'

# The variables block is REMOVED so ADO uses your UI secrets!

steps:
- task: Bash@3
  displayName: 'Download Latest Artifact from JFrog'
  env:
    SECURE_JF_URL: $(JFROG_URL)
    SECURE_JF_USER: $(JFROG_USERNAME)
    SECURE_JF_TOKEN: $(JFROG_TOKEN)
    CI: true
  inputs:
    targetType: 'inline'
    script: |
      echo "Installing JFrog CLI..."
      curl -fL https://install-cli.jfrog.io | sh
      
      echo "Safety Check: Verifying ADO passed the variables..."
      if [ -z "$SECURE_JF_URL" ]; then
        echo "ERROR: JFROG_URL is empty! ADO is not passing the UI variable."
        exit 1
      fi
      
      echo "Downloading the latest ZIP artifact..."
      mkdir -p ./artifact
      
      /usr/local/bin/jf rt dl "loya-static-libs/*.zip" ./artifact/ \
        --url="$SECURE_JF_URL"/artifactory \
        --user="$SECURE_JF_USER" \
        --password="$SECURE_JF_TOKEN" \
        --sort-by=created \
        --sort-order=desc \
        --limit=1
      
      ZIP_PATH=$(find ./artifact -name "*.zip" | head -n 1)
      
      if [ -z "$ZIP_PATH" ]; then
        echo "Error: Could not find downloaded ZIP file!"
        exit 1
      fi
      
      echo "Downloaded: $ZIP_PATH"
      mv "$ZIP_PATH" ./latest-deploy.zip

- task: CopyFilesOverSSH@0
  displayName: 'Transfer Artifact to Azure VM'
  inputs:
    sshEndpoint: 'voya-vm-ssh-connection' 
    sourceFolder: '$(System.DefaultWorkingDirectory)'
    contents: 'latest-deploy.zip'
    targetFolder: '/home/azureuser/'
    readyTimeout: '20000'

- task: SSH@0
  displayName: 'Extract and Execute Deployment on VM'
  inputs:
    sshEndpoint: 'voya-vm-ssh-connection'
    runOptions: 'inline'
    inline: |
      echo "Navigating to home directory..."
      cd /home/azureuser/
      
      echo "Unzipping the artifact..."
      unzip -o latest-deploy.zip -d deploy_temp
      
      echo "Executing the deployment script!"
      bash deploy_temp/package-content/scripts/deploy_static.sh /home/azureuser/voya_deploy/static
      
      echo "Cleaning up temporary files..."
      rm latest-deploy.zip
      rm -rf deploy_temp
      
      echo "Deployment Complete!"